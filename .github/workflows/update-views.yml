name: Update YouTube views

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 한국 시간 새벽 3시 (UTC 18:00)
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행
  push:
    paths:
      - 'data/portfolio.js' # 포트폴리오 파일을 올리면 바로 갱신

permissions:
  contents: write

concurrency:
  group: update-views      # 겹치면 하나씩 순서대로
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch view counts
        run: node scripts/update-views.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit views.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/views.json
          git diff --staged --quiet && exit 0
          git commit -m "Update YouTube views"
          git pull --rebase origin ${{ github.ref_name }}
          git push
