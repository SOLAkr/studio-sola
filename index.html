/* section entrance, like applying an effect in the editor: the section waits dim and desaturated (a raw clip);
   a cursor drags an effect icon in from the right and drops it, then the section brightens to full colour */
.sec-rv{position:relative}
/* the "raw clip" look is a dim, desaturating veil over the section; once the effect is dropped,
   a growing hole in the veil spreads the colour outward from the drop point */
@property --rvr{syntax:'<length>';initial-value:0px;inherits:false}
.sec-rv::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:rgba(6,7,12,.5);-webkit-backdrop-filter:grayscale(1) brightness(.62);backdrop-filter:grayscale(1) brightness(.62);--rvr:0px;-webkit-mask-image:radial-gradient(circle at 50% 230px, transparent max(0px, calc(var(--rvr) - 460px)), #000 var(--rvr));mask-image:radial-gradient(circle at 50% 230px, transparent max(0px, calc(var(--rvr) - 460px)), #000 var(--rvr))}
.sec-rv.in::before{animation:rv-spread 1.3s cubic-bezier(.3,.5,.3,1) .5s forwards}
.sec-rv.ready::before{visibility:hidden}
@keyframes rv-spread{from{--rvr:0px}to{--rvr:2900px}}
.rv-drag{position:absolute;left:50%;top:230px;width:0;height:0;z-index:6;pointer-events:none;opacity:0}
.rv-fx{position:absolute;left:-20px;top:-17px;width:40px;height:35px;display:block;overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(104,152,255,.35))}
.rv-cur{position:absolute;left:4px;top:6px;width:20px;height:auto;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));transform-origin:0 0}
.rv-drag::after{content:"";position:absolute;left:-34px;top:-34px;width:68px;height:68px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(140,175,255,.85);opacity:0}
.sec-rv.in .rv-drag{animation:rv-drag-move 1s cubic-bezier(.4,0,.25,1) both}

/* 첫 화면 인트로 (사진 1초 → 서서히 사라짐) */
#intro{position:fixed;inset:0;z-index:2147483000;background:#0a0504 url(assets/intro.jpg) center/cover no-repeat;opacity:1;transition:opacity .6s ease;touch-action:none}
#intro.out{opacity:0}
html.seen-intro #intro{display:none}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"></div>
<script>
// 인트로: 사진이 뜬 뒤 1초 유지 → 0.6초 동안 서서히 투명해지며 사라짐. 떠 있는 동안 스크롤 막기.
(function(){
  var el=document.getElementById('intro'); if(!el) return;
  if(/(^| )seen-intro( |$)/.test(document.documentElement.className)){ el.parentNode.removeChild(el); return; }
  try{ sessionStorage.setItem('sola-intro','1'); }catch(e){}
  var KEYS={32:1,33:1,34:1,35:1,36:1,37:1,38:1,39:1,40:1};
  var lockY=null, done=false;
  function stop(e){ if(!done){ e.preventDefault(); e.stopPropagation(); } }
  function key(e){ if(!done && KEYS[e.keyCode]){ e.preventDefault(); e.stopPropagation(); } }
  function hold(){ if(done) return; if(lockY===null){ lockY=window.scrollY; return; } if(window.scrollY!==lockY) window.scrollTo(0,lockY); }
  var opt={passive:false,capture:true};
  window.addEventListener('wheel',stop,opt); window.addEventListener('touchmove',stop,opt); window.addEventListener('keydown',key,true); window.addEventListener('scroll',hold,true);
  function release(){ done=true; window.removeEventListener('wheel',stop,opt); window.removeEventListener('touchmove',stop,opt); window.removeEventListener('keydown',key,true); window.removeEventListener('scroll',hold,true); if(el.parentNode) el.parentNode.removeChild(el); }
  var started=false;
  function start(){ if(started) return; started=true; setTimeout(function(){ el.classList.add('out'); setTimeout(release,650); },1000); }
  var img=new Image(); img.onload=start; img.onerror=start; img.src='assets/intro.jpg';
  if(img.complete) start();
  setTimeout(start,2500); // 사진이 늦게 오면 그래도 넘어가기
})();
</script>
<div id="root"></div>
