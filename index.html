body{margin:0;background:var(--sc-1)}
a{color:var(--sc-2)}a:hover{color:var(--sc-3)}
.nav-a{color:var(--sc-4);text-decoration:none;transition:color .2s}
.nav-a:hover{color:#FFFFFF}
.nav-a.is-active{color:#FFFFFF}
nav:hover .nav-a.is-active:not(:hover){color:var(--sc-4)}
@media (prefers-reduced-motion: reduce){.nav-pill{transition:none !important}}
.btn{transition:transform .25s cubic-bezier(.2,.8,.25,1), box-shadow .25s, background .25s, border-color .25s, color .25s}
.btn:hover,.btn:focus-visible{transform:translateY(-1px);background:var(--sc-103) !important;border-color:var(--sc-104) !important;color:#FFFFFF !important}
.card{transition:transform .3s, border-color .3s}
.card:hover{transform:translateY(-3px);border-color:var(--sc-105)}
/* info boxes (tools, career stats) aren't clickable: no lift, just a quiet light-up on hover */
.tool-card,.stat-card{transition:border-color .3s, background-color .3s}
.tool-card:hover{border-color:var(--sc-106) !important;background-color:rgba(255,255,255,0.05) !important}
.stat-card:hover{border-color:var(--sc-107) !important;background-color:var(--sc-108) !important}
.stat-num{position:relative;transition:color .3s, text-shadow .3s}
.stat-card:hover .stat-num{color:var(--sc-109) !important;text-shadow:0 0 8px var(--sc-110)}
/* career numbers count up: the real text stays for layout, the counting copy sits on top */
/* the real text stays invisible under the rolling copy, hover included (only its fade-up entrance still animates) */
.stat-card .stat-num.roll-on,.stat-card:hover .stat-num.roll-on{color:transparent !important;text-shadow:none !important;transition:opacity .7s ease, translate 1s cubic-bezier(.22,1.25,.36,1) !important}
.stat-num .roll{position:absolute;left:0;top:0;display:flex;align-items:flex-start;white-space:pre;pointer-events:none;transition:color .3s, text-shadow .3s}
.stat-card:hover .stat-num .roll{color:var(--sc-109) !important;text-shadow:0 0 8px var(--sc-110)}
/* career boxes: the labels just sit there; only the numbers drop in from above once the section has lit up */
.stat-card > .stat-num{opacity:0;translate:0 -34px;transition:opacity .7s ease, translate 1s cubic-bezier(.22,1.25,.36,1)}
.st-in .stat-card > .stat-num{opacity:1;translate:0 0}
.st-in .stat-card:nth-child(2) > .stat-num{transition-delay:.1s}
.st-in .stat-card:nth-child(3) > .stat-num{transition-delay:.2s}
.dc-edit .stat-card > .stat-num{opacity:1 !important;translate:0 0 !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.stat-card > .stat-num{opacity:1;translate:0 0;transition:none}}
.f-in{width:100%;box-sizing:border-box;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:13px 16px;color:var(--sc-5);font-family:inherit;font-size:15px;min-height:48px;color-scheme:dark}
.f-in:focus{outline:none;border-color:var(--sc-2);box-shadow:0 0 0 3px var(--sc-111)}
.f-in::placeholder{color:var(--sc-6)}
.f-in option{background:var(--sc-7);color:var(--sc-5)}
@property --ring{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ring-spin{to{--ring:360deg}}
.ring-run{position:relative;isolation:isolate;--ring-t:4.2s}
/* Discord box outline light: runs clockwise along the rounded border at a constant speed.
   Built from nested dashes that all end at the head; each layer shifts colour from blue (tail) to light blue (head) and per-layer opacities give an even ramp. Each layer's place in the streak is built into its dash pattern, so all layers share one animation and stay aligned. */
.ring-svg{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);overflow:visible;pointer-events:none;z-index:1}
.ring-svg rect{width:calc(100% - 2px);height:calc(100% - 2px);fill:none;stroke-width:2;stroke-linecap:butt;animation:ring-run var(--ring-t) linear infinite}
.ring-blur{filter:blur(5px);opacity:.6}
.ring-blur rect{stroke-width:6}
@media (prefers-reduced-motion: reduce){.ring-svg rect{animation:none}}
@keyframes ring-run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.glow-ring{position:relative;isolation:isolate}
.copy-card{color:var(--sc-5);transition:background .25s, transform .3s, border-color .3s}
.copy-card:hover{background:rgba(255,255,255,0.075) !important}
.copy-hint{color:var(--sc-8);transition:color .2s}
.copy-card:hover .copy-hint{color:var(--sc-5)}
.copy-hint.done,.copy-card:hover .copy-hint.done{color:#7FE0A8}

/* 실제 사이트: 컴퓨터는 마우스 아이콘만, 폰·태블릿은 폰 아이콘만 (둘 다 나오는 건 디자인 미리보기에서만). 기기 판별은 아래 스크립트가 */
#scroll-hint.sh-desk .sh-phone{display:none}
#scroll-hint.sh-touch{padding:18px 22px}#scroll-hint.sh-touch .sh-mouse,#scroll-hint.sh-touch .sh-chev{display:none}#scroll-hint.sh-touch .sh-phone{width:26px;height:41px;border-width:2px;border-radius:6px;opacity:1}#scroll-hint.sh-touch .sh-phone::before{top:3px;width:7px;height:2px;margin-left:-3.5px}#scroll-hint.sh-touch .sh-phone::after{bottom:6px;width:7px;height:7px;margin-left:-3.5px;--sw:-17px}

<div id="intro" aria-hidden="true"></div>
<script>
// 인트로: 사진이 뜬 뒤 0.6초 유지 → 0.6초 동안 서서히 투명해지며 사라짐. 떠 있는 동안 스크롤 막기.
(function(){
  var el=document.getElementById('intro'); if(!el) return;
  if(/(^| )seen-intro( |$)/.test(document.documentElement.className)){ el.parentNode.removeChild(el); return; }
  try{ sessionStorage.setItem('sola-intro','1'); }catch(e){}
  window.__solaIntroOn=true;
  var KEYS={32:1,33:1,34:1,35:1,36:1,37:1,38:1,39:1,40:1};
  var lockY=null, done=false;
  function stop(e){ if(!done){ e.preventDefault(); e.stopPropagation(); } }
  function key(e){ if(!done && KEYS[e.keyCode]){ e.preventDefault(); e.stopPropagation(); } }
  function hold(){ if(done) return; if(lockY===null){ lockY=window.scrollY; return; } if(window.scrollY!==lockY) window.scrollTo(0,lockY); }
  var opt={passive:false,capture:true};
  window.addEventListener('wheel',stop,opt); window.addEventListener('touchmove',stop,opt); window.addEventListener('keydown',key,true); window.addEventListener('scroll',hold,true);
  function release(){ done=true; window.removeEventListener('wheel',stop,opt); window.removeEventListener('touchmove',stop,opt); window.removeEventListener('keydown',key,true); window.removeEventListener('scroll',hold,true); if(el.parentNode) el.parentNode.removeChild(el); window.__solaIntroOn=false; try{ window.dispatchEvent(new Event('sola-intro-done')); }catch(e){} }
  var started=false;
  function start(){ if(started) return; started=true; setTimeout(function(){ el.classList.add('out'); setTimeout(release,650); },600); }
  var img=new Image(); img.onload=start; img.onerror=start; img.src='assets/intro.jpg';
  if(img.complete) start();
  setTimeout(start,2500); // 사진이 늦게 오면 그래도 넘어가기
})();
</script>
<div id="scroll-hint" aria-hidden="true"><div class="sh-icons"><div class="sh-mouse"></div><div class="sh-phone"></div></div><div class="sh-chev"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 2l6 5 6-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 2l6 5 6-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<script>
// 스크롤 안내: 첫 화면(맨 위)에서 1.5초 동안 스크롤 조작이 없으면 가운데에 아이콘 표시. 휠·스와이프·스크롤 키로만 사라지고(클릭·탭은 그대로), 한 번 사라지면 새로고침 전까지 다시 안 뜸.
// 한 번 화면을 내리고 나면 더 이상 뜨지 않음.
(function(){
  var el=document.getElementById('scroll-hint'); if(!el) return;
  // 폰·태블릿 판별: 일부 폰 브라우저는 hover 지원을 잘못 알려줘서, 터치 여부와 화면 크기로 직접 판단
  var touch=false;
  try{
    var coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
    var fineAny=window.matchMedia&&matchMedia('(any-pointer: fine)').matches;
    var tp=(navigator.maxTouchPoints||0)>0||('ontouchstart' in window);
    var small=Math.min(screen.width||9999,screen.height||9999)<=1024;
    touch=coarse||(tp&&(small||!fineAny));
  }catch(e){}
  el.classList.add(touch?'sh-touch':'sh-desk');
  var IDLE=1500, TOP=40, timer=0, finished=false;
  function hide(){ el.classList.remove('on'); }
  function arm(){ clearTimeout(timer); if(finished || window.__solaIntroOn) return; timer=setTimeout(function(){ if(!finished && !window.__solaIntroOn && window.scrollY<TOP) el.classList.add('on'); },IDLE); }
  var KEYS={32:1,33:1,34:1,35:1,36:1,38:1,40:1};
  function finish(){ finished=true; clearTimeout(timer); hide(); ['wheel','touchmove','keydown'].forEach(function(n){ window.removeEventListener(n,act,true); }); window.removeEventListener('scroll',onScroll,true); }
  // 한 번 사라지면 새로고침 전까지 다시 안 뜸. 뜨기 전의 조작은 기다리는 시간만 다시 셈
  function act(e){ if(e && e.type==='keydown' && !KEYS[e.keyCode]) return; if(el.classList.contains('on')){ finish(); return; } arm(); }
  function onScroll(){ if(window.scrollY>=TOP){ finish(); } else act(); }
  ['wheel','touchmove','keydown'].forEach(function(n){ window.addEventListener(n,act,{capture:true,passive:true}); });
  window.addEventListener('scroll',onScroll,{capture:true,passive:true});
  window.addEventListener('sola-intro-done',arm);
  if(window.scrollY>=TOP) finish(); else arm();
})();
</script>
<div id="root"></div>
<script>
// 작업 순서 타임라인이 화면보다 넓으면 폭에 맞게 줄여서 한눈에 다 보이게 (폰은 480px 작은 레이아웃 기준)
(function(){
  var mq=window.matchMedia?matchMedia('(max-width: 760px)'):null;
  function fit(){
    var g=document.querySelector('[style*="grid-template-columns: 44px repeat(7"]'); if(!g) return false;
    var box=g.parentElement, sc=box&&box.parentElement; if(!sc) return false;
    var w=sc.clientWidth; if(!w) return true;
    var base=(mq&&mq.matches)?480:960;   // 폰: 작은 레이아웃(480px) / 좁은 데스크톱 창: 원래 레이아웃(960px)을 창 폭에 맞게
    if(w>=base){ box.style.transform=''; box.style.transformOrigin=''; sc.style.height=''; sc.style.overflow=''; return true; }
    var s=w/base; box.style.transformOrigin='0 0'; sc.style.overflow='hidden';
    box.style.transform='scale('+s+')';
    sc.style.height=Math.ceil(box.offsetHeight*s)+'px';
    return true;
  }
  var tries=0; (function wait(){ if(!fit() && tries++<200) setTimeout(wait,100); })();
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){ setTimeout(fit,200); });
  if(mq&&mq.addEventListener) mq.addEventListener('change',fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>

    } catch (e) {
